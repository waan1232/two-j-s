services:
  - type: web
    name: two-js-beverage
    env: static
    staticPublishPath: .
    buildCommand: echo "static"
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /google467a16ac4bc7e83a.html
        destination: /google467a16ac4bc7e83a.html
      - type: rewrite
        source: /*
        destination: /index.html
